name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext libglib2.0-bin gnome-shell

      - name: Build extension zip
        run: make pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: github-contribution-grid@erxanitea.shell-extension.zip
          generate_release_notes: true
